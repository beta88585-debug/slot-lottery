<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>LINE 抽獎拉霸</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { text-align: center; font-family: sans-serif; }
    #slot { display: flex; justify-content: center; margin-top: 30px; }
    .reel {
      width: 100px; height: 100px; margin: 0 10px;
      border: 2px solid #333; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: bold;
    }
    button {
      padding: 15px 30px; margin-top: 30px;
      font-size: 18px; cursor: pointer; border-radius: 10px;
    }
  </style>
</head>
<body>
  <h1>今日抽獎拉霸機</h1>
  <div id="slot">
    <div class="reel" id="r1">?</div>
    <div class="reel" id="r2">?</div>
    <div class="reel" id="r3">?</div>
  </div>
  <button onclick="start()">開始抽獎</button>
  <p id="msg"></p>

<script>
  const LIFF_ID = "2008566845-ylJbXNmB";  // <= 要替換！

  async function initLiff() {
    await liff.init({ liffId: LIFF_ID });

    if (!liff.isLoggedIn()) {
      liff.login();
    }
  }
  initLiff();

  const prizes = ["再接再厲", "50元券", "100元券", "大獎"];

  function start() {
    const msg = document.getElementById("msg");
    msg.innerHTML = "";

    const result = prizes[Math.floor(Math.random() * prizes.length)];
    const final = [result, result, result];

    spinReels(final, () => {
      msg.innerHTML = `🎉 你抽到：${result}`;
    });
  }

  function spinReels(final, callback) {
    const reels = ["r1", "r2", "r3"].map(id => document.getElementById(id));
    const spinTime = 1200;
    const interval = 80;
    const start = Date.now();

    const timer = setInterval(() => {
      const elapsed = Date.now() - start;

      reels.forEach(r => {
        r.innerHTML = prizes[Math.floor(Math.random() * prizes.length)];
      });

      if (elapsed >= spinTime) {
        clearInterval(timer);
        reels[0].innerHTML = final[0];
        reels[1].innerHTML = final[1];
        reels[2].innerHTML = final[2];
        callback();
      }
    }, interval);
  }
</script>
</body>
</html>
