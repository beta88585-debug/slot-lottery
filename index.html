<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>社群限定拉霸</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
/* ---------------------------
   全域 RESET
----------------------------*/
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
}

/* ---------------------------
   背景：固定在底層（不再擠壓機台）
----------------------------*/
.bg-layer {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at top, #ffefba 0%, #ffb347 12%, transparent 40%),
    radial-gradient(circle at bottom, #3b0000 0%, #000000 55%);
  z-index: -1;
  pointer-events: none;
}

/* ---------------------------
   Body：真正置中、不被背景干擾
----------------------------*/
body {
  min-height: 100dvh; /* LINE iPhone 真正高度 */
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #1a0000; /* 純底色，避免背景推擠 */
}

/* ---------------------------
   Wrapper：主要置中的容器
----------------------------*/
.center-wrapper {
  position: relative;
  top: 50%;
  transform: translateY(-50%); /* 垂直置中 */
  width: 100%;
  max-width: 380px;
  padding: 0 16px;
  display: flex;
  justify-content: center;
}

/* ---------------------------
   外層金框光暈
----------------------------*/
.frame-shadow {
  padding: 12px;
  border-radius: 26px;
  background: radial-gradient(circle at top, #ffcf6b, #7f3b00);
  box-shadow:
    0 18px 30px rgba(0,0,0,0.6),
    0 0 35px rgba(255,215,0,0.35);
}

/* ---------------------------
   機台本體
----------------------------*/
.machine {
  width: 100%;
  background: linear-gradient(160deg, #3a0006, #180009);
  border-radius: 22px;
  padding: 16px 12px 20px;
  box-shadow:
    inset 0 0 18px rgba(0,0,0,0.9),
    0 0 0 3px rgba(255,255,255,0.15);
  position: relative;
  overflow: hidden;
}

/* 玻璃亮光 */
.machine::before {
  content:"";
  position: absolute;
  inset: 0;
  border-radius: 22px;
  background: linear-gradient(
    135deg,
    rgba(255,255,255,0.25) 0%,
    transparent 30%,
    transparent 70%,
    rgba(255,255,255,0.15) 100%
  );
  pointer-events: none;
  opacity: 0.45;
}

/* ---------------------------
   Title
----------------------------*/
.title {
  text-align: center;
  font-weight: 800;
  font-size: 18px;
  color: #ffeaa7;
  letter-spacing: 1.5px;
  text-shadow:
    0 0 6px rgba(0,0,0,0.8),
    0 0 12px rgba(255,215,0,0.9);
  margin-bottom: 5px;
}
.subtitle {
  text-align: center;
  font-size: 11px;
  color: #ffdddd;
  opacity: 0.85;
  margin-bottom: 14px;
}

/* ---------------------------
   Reel Frame
----------------------------*/
.reel-frame {
  background: radial-gradient(circle at top, #fff7d6, #ffd86a 30%, #4c0000 90%);
  padding: 8px;
  border-radius: 18px;
  box-shadow:
    inset 0 0 10px rgba(0,0,0,0.7),
    0 0 14px rgba(255,222,173,0.7);
}

.reel-inner {
  background: linear-gradient(180deg, #181828, #050510);
  border-radius: 14px;
  padding: 8px 8px;
  box-shadow:
    inset 0 0 16px rgba(0,0,0,0.9),
    0 0 18px rgba(0,255,255,0.35);
}

/* 三個轉輪 */
.reels {
  display: flex;
  justify-content: center;
  gap: 10px;
}

canvas {
  background: radial-gradient(circle at top, #282840, #050510);
  border-radius: 14px;
  width: 90px;
  height: 110px;
  box-shadow:
    0 0 0 2px rgba(0,0,0,0.7),
    0 0 18px rgba(0,255,255,0.5);
}

/* ---------------------------
   Neon Bar
----------------------------*/
.neon-bar {
  height: 4px;
  border-radius: 999px;
  margin: 12px 28px 12px;
  background: linear-gradient(
    90deg,
    rgba(0,255,255,0) 0%,
    rgba(0,255,255,0.7) 35%,
    rgba(255,0,255,0.7) 65%,
    rgba(255,255,0,0) 100%
  );
  box-shadow:
    0 0 10px rgba(0,255,255,0.8),
    0 0 18px rgba(255,0,255,0.8);
}

/* ---------------------------
   SPIN Button
----------------------------*/
#spinBtn {
  width: 140px;
  padding: 12px;
  border: none;
  border-radius: 999px;
  background: radial-gradient(circle at top, #fff5cc, #ffd33b 40%, #ff9f1a 80%);
  font-size: 16px;
  font-weight: 800;
  color: #3a0000;
  cursor: pointer;
  box-shadow:
    0 10px 0 #b05d00,
    0 16px 20px rgba(0,0,0,0.7);
  transition: transform .08s ease, box-shadow .1s ease;
}
#spinBtn:active:not(:disabled) {
  transform: translateY(3px);
  box-shadow:
    0 4px 0 #b05d00,
    0 8px 10px rgba(0,0,0,0.7);
}
#spinBtn:disabled {
  opacity: 0.6;
}

/* Result */
#msg {
  margin-top: 10px;
  font-size: 13px;
  font-weight: 600;
  color: #ffeaa7;
  text-shadow: 0 0 6px rgba(0,0,0,0.7);
  min-height: 22px;
}
.footer {
  margin-top: 8px;
  font-size: 10px;
  opacity: 0.6;
  color: #ffd6d6;
}
</style>
</head>

<body>

<!-- 背景：獨立層，不會影響機台位置 -->
<div class="bg-layer"></div>

<!-- 主機台置中 -->
<div class="center-wrapper">
  <div class="frame-shadow">
    <div class="machine">

      <div class="title">LUCKY SLOT</div>
      <div class="subtitle">社群限定｜深紅豪華賭場拉霸</div>

      <div class="reel-frame">
        <div class="reel-inner">
          <div class="reels">
            <canvas id="reel1"></canvas>
            <canvas id="reel2"></canvas>
            <canvas id="reel3"></canvas>
          </div>
        </div>
      </div>

      <div class="neon-bar"></div>

      <button id="spinBtn" disabled>載入中…</button>

      <div id="msg"></div>
      <div class="footer">本頁為娛樂示意，不涉及金錢博弈。</div>

    </div>
  </div>
</div>

<script>
const LIFF_ID="2008566845-ylJbXNmB";

const SYMBOL_PATHS=[
  "assets/symbols/cherry.png",
  "assets/symbols/lemon.png",
  "assets/symbols/grape.png",
  "assets/symbols/star.png"
];
const SYMBOL_KEYS=["cherry","lemon","grape","star"];

const CHANGE_INTERVAL=70;
const SPIN_TIME=[1000,1350,1700];

let reels=[],images=[];

/* -------------------------------
   初始化
--------------------------------*/
document.addEventListener("DOMContentLoaded",async()=>{
  try{
    await liff.init({liffId:LIFF_ID});
    if(!liff.isLoggedIn()) return liff.login();
  }catch(e){}

  preloadImages(SYMBOL_PATHS,()=>{
    initReels();
    const btn=document.getElementById("spinBtn");
    btn.disabled=false;
    btn.textContent="SPIN";
    btn.onclick=startSpin;
  });
});

function preloadImages(list,cb){
  let cnt=0;
  images=list.map(src=>{
    const img=new Image();
    img.src=src;
    img.onload=()=>{cnt++;if(cnt===list.length)cb();};
    return img;
  });
}

function initReels(){
  const canvases=["reel1","reel2","reel3"];
  canvases.forEach(id=>{
    const cvs=document.getElementById(id);
    cvs.width=90;
    cvs.height=110;
    const ctx=cvs.getContext("2d");
    reels.push({
      ctx,
      index:randIndex(),
      spinning:false,
      lastChange:0
    });
  });
  reels.forEach(drawReel);
}

function drawReel(r){
  const ctx=r.ctx;
  ctx.clearRect(0,0,90,110);
  const img=images[r.index];
  if(!img)return;
  ctx.drawImage(img, 10, 10, 70, 70);
}

/* -------------------------
   SPIN
--------------------------*/
let spinning=false;

function startSpin(){
  if(spinning)return;
  spinning=true;

  document.getElementById("msg").textContent="";
  const btn=document.getElementById("spinBtn");
  btn.disabled=true;
  btn.textContent="SPINNING…";

  const start=performance.now();

  reels.forEach((r,i)=>{
    r.spinning=true;
    r.lastChange=start;
    setTimeout(()=>{r.spinning=false;},SPIN_TIME[i]);
  });

  requestAnimationFrame(function loop(now){
    let active=false;
    reels.forEach(r=>{
      if(r.spinning){
        active=true;
        if(now-r.lastChange>CHANGE_INTERVAL){
          r.index=randIndex();
          r.lastChange=now;
        }
      }
      drawReel(r);
    });
    if(active) requestAnimationFrame(loop);
    else finishSpin();
  });
}

function finishSpin(){
  const final=[randIndex(),randIndex(),randIndex()];
  reels.forEach((r,i)=>{r.index=final[i];drawReel(r);});

  const resultKeys=final.map(i=>SYMBOL_KEYS[i]);
  const score=calcScore(resultKeys);

  document.getElementById("msg").textContent=
    score>0
    ?`🎉 恭喜！${resultKeys.join(" | ")} ➜ 得分：${score}`
    :`😅 ${resultKeys.join(" | ")}（未中獎）`;

  const btn=document.getElementById("spinBtn");
  btn.disabled=false;
  btn.textContent="SPIN";
  spinning=false;
}

function randIndex(){return Math.floor(Math.random()*SYMBOL_PATHS.length);}
function calcScore(r){
  if(r[0]===r[1]&&r[1]===r[2]){
    if(r[0]==="star")return 500;
    if(r[0]==="cherry")return 200;
    if(r[0]==="lemon")return 120;
    if(r[0]==="grape")return 150;
  }
  return 0;
}
</script>

</body>
</html>
