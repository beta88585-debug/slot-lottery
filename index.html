<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>幸運拉霸 🍒</title>

<style>
    /* ===== 背景 ===== */
    body {
        margin: 0;
        padding: 0;
        background: radial-gradient(circle at center top, #d9a84b 0%, #000 60%);
        font-family: "PingFang TC", sans-serif;
        overflow-x: hidden;
    }

    /* ===== 機台容器（置中 + 對稱 + 無裁切） ===== */
    .machine-wrapper {
        width: 92vw;              /* ⭐ 保留左右 4% 空間 → 完美對稱 */
        max-width: 390px;         /* ⭐ 避免太寬造成裁切 */
        margin: 3vh auto 0 auto;
        margin: 6vh auto 0 auto;   /* ⭐ 完美高度，不會被切 */
        display: block;
    }

    /* ===== 機台外框 ===== */
    .machine-frame {
        width: 100%;
        display: block;
    }

    /* ===== 三欄轉輪區 ===== */
    .reels {
        display: flex;
        justify-content: space-between;
        width: 100%;
        margin-top: -215px;       /* ⭐ 將水果對準機台窗口 */
        padding: 0 28px;          /* ⭐ 三欄左右均衡 */
        box-sizing: border-box;
    }

    .reel-box {
        width: 30%;
        height: 88px;
        background: #0b0f1c;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;

        border: 3px solid rgba(0, 255, 255, 0.06);
        box-shadow: inset 0 0 20px rgba(0,255,255,0.08);
    }

    .reel-box img {
        width: 80%;
        height: auto;
        object-fit: contain;      /* ⭐ 不變形 */
    }

    /* ===== SPIN 按鈕 ===== */
    .spin-btn {
        width: 75%;
        margin: 20px auto 10px auto;
        padding: 14px 0;
        font-size: 22px;
        text-align: center;
        border-radius: 20px;
        background: linear-gradient(#fdd877, #c38117);
        box-shadow: 0 4px 0 #8a5a00;
        font-weight: bold;
        color: #4b2800;
    }

    /* 結果文字 */
    .result {
        text-align: center;
        margin-top: 10px;
        font-size: 16px;
        color: #fff1d9;
    }

    /* 免責聲明 */
    .notice {
        margin-top: 20px;
        text-align: center;
        font-size: 14px;
        opacity: .7;
        color: #fff;
    }
</style>
</head>

<body>

<!-- ==================== 機台主體 ==================== -->
<div class="machine-wrapper">
    <img src="assets/machine.png" class="machine-frame">

    <!-- ===== 三個水果欄位 ===== -->
    <div class="reels">
        <div class="reel-box"><img id="r1" src="assets/symbols/lemon.png"></div>
        <div class="reel-box"><img id="r2" src="assets/symbols/star.png"></div>
        <div class="reel-box"><img id="r3" src="assets/symbols/cherry.png"></div>
    </div>

    <!-- SPIN 按鈕 -->
    <div class="spin-btn" onclick="spin()">SPIN</div>

    <!-- 結果 -->
    <div class="result" id="resultText">🍋 lemon | ⭐ star | 🍒 cherry（未中獎）</div>

    <!-- 免責聲明 -->
    <div class="notice">本頁為娛樂示意，不涉及金錢博弈。</div>
</div>

<script>
const symbols = ["lemon","star","grape","cherry"];

function spin(){
    let r1 = symbols[Math.floor(Math.random()*symbols.length)];
    let r2 = symbols[Math.floor(Math.random()*symbols.length)];
    let r3 = symbols[Math.floor(Math.random()*symbols.length)];

    document.getElementById("r1").src = `assets/symbols/${r1}.png`;
    document.getElementById("r2").src = `assets/symbols/${r2}.png`;
    document.getElementById("r3").src = `assets/symbols/${r3}.png`;

    document.getElementById("resultText").innerText =
        `😅 ${r1} | ${r2} | ${r3}（未中獎）`;
}
</script>

</body>
</html>
