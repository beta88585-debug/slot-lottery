<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>幸運拉霸 🍒</title>

<!-- 背景與排版 -->
<style>
    body {
        margin: 0;
        padding: 0;
        background: url("assets/bg/slot_bg.png") no-repeat center top;
        background-size: cover;
        background-color: black;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial;
        color: #fff;
        text-align: center;
    }

    /* Slot 框架置中 */
    .slot-container {
        width: 100%;
        display: flex;
        justify-content: center;
        margin-top: 160px; /* 背景上方空白 */
    }

    .slot-box {
        background: rgba(0,0,0,0.35);
        padding: 25px;
        border-radius: 20px;
        backdrop-filter: blur(8px);
        width: 85%;
        max-width: 420px;
    }

    .slot-row {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-bottom: 20px;
    }

    .slot {
        width: 110px;
        height: 110px;
        border-radius: 15px;
        background: #111;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0 0 10px #000;
    }

    .slot img {
        width: 90%;
    }

    /* 按鈕 */
    #spinBtn {
        width: 90%;
        max-width: 360px;
        padding: 15px 0;
        font-size: 26px;
        border: none;
        border-radius: 15px;
        background: linear-gradient(#ffdd77, #d8a438);
        color: #3a2700;
        font-weight: bold;
        box-shadow: 0 6px 0 #a1781f;
    }

    /* 結果區 */
    #result {
        margin-top: 18px;
        font-size: 20px;
    }
</style>
</head>
<body>

<div class="slot-container">
    <div class="slot-box">

        <h2 style="letter-spacing:3px;margin-bottom:10px;">LUCKY SLOT</h2>

        <div class="slot-row">
            <div class="slot"><img id="s1" src="assets/symbols/cherry.png"></div>
            <div class="slot"><img id="s2" src="assets/symbols/star.png"></div>
            <div class="slot"><img id="s3" src="assets/symbols/lemon.png"></div>
        </div>

        <button id="spinBtn">SPIN</button>

        <div id="result"></div>
        <p style="font-size:14px;margin-top:18px;opacity:0.5;">
            本頁為娛樂示意，不涉及金錢博弈。
        </p>
    </div>
</div>

<!-- Slot Script -->
<script>
    const symbols = [
        "assets/symbols/cherry.png",
        "assets/symbols/lemon.png",
        "assets/symbols/star.png",
        "assets/symbols/grape.png"
    ];

    document.getElementById("spinBtn").addEventListener("click", spin);

    function spin() {
        const r1 = symbols[Math.floor(Math.random() * symbols.length)];
        const r2 = symbols[Math.floor(Math.random() * symbols.length)];
        const r3 = symbols[Math.floor(Math.random() * symbols.length)];

        document.getElementById("s1").src = r1;
        document.getElementById("s2").src = r2;
        document.getElementById("s3").src = r3;

        // 結果文字
        const name = (p) => p.includes("cherry") ? "🍒 cherry" :
                             p.includes("lemon") ? "🍋 lemon" :
                             p.includes("star")  ? "⭐ star" : "🍇 grape";

        const result = `${name(r1)} | ${name(r2)} | ${name(r3)}`;

        let msg = "";
        if (r1 === r2 && r2 === r3) msg = "（🎉 中獎！）";
        else msg = "（未中獎）";

        document.getElementById("result").innerHTML =
            `<span style="font-size:20px">${result}</span> <br>${msg}`;
    }
</script>

</body>
</html>
