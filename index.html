<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>LINE 抽獎拉霸 🍒</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top, #ffecd2, #fcb69f);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
      color: #333;
    }
    .wrapper {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 12px 40px;
    }
    h1 {
      margin: 8px 0 16px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
    }
    .machine {
      background: #ffffffee;
      border-radius: 20px;
      box-shadow: 0 12px 25px rgba(0,0,0,0.15);
      padding: 18px 12px 22px;
    }
    .reels {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    canvas {
      background: #181824;
      border-radius: 14px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.7);
    }
    #spinBtn {
      padding: 12px 30px;
      border-radius: 999px;
      border: none;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg,#ff6b6b,#fcb045);
      color: #fff;
      box-shadow: 0 8px 16px rgba(0,0,0,0.25);
    }
    #spinBtn:disabled {
      opacity: 0.6;
      box-shadow: none;
      cursor: not-allowed;
    }
    #msg {
      margin-top: 12px;
      min-height: 22px;
      font-size: 14px;
      font-weight: 600;
    }
  </style>
</head>
<body>
<div class="wrapper">
  <h1>LINE 抽獎拉霸 🍒</h1>

  <div class="machine">
    <div class="reels">
      <canvas id="reel1" width="110" height="140"></canvas>
      <canvas id="reel2" width="110" height="140"></canvas>
      <canvas id="reel3" width="110" height="140"></canvas>
    </div>
    <button id="spinBtn" disabled>載入中…</button>
    <div id="msg"></div>
  </div>
</div>

<script>
  const LIFF_ID = "2008566845-ylJbXNmB";

  // 圖片路徑 & 名稱（對應分數顯示用）
  const SYMBOL_PATHS = [
    "assets/symbols/cherry.png",
    "assets/symbols/lemon.png",
    "assets/symbols/grape.png",
    "assets/symbols/star.png"
  ];
  const SYMBOL_KEYS = ["cherry","lemon","grape","star"];

  const CHANGE_INTERVAL = 80;  // 轉動時換圖速度(ms)
  const SPIN_TIME = [1200, 1600, 2000]; // 三軸停止時間

  let reels = [];      // 每軸畫布資料
  let images = [];     // 預載好的 Image 物件
  let spinning = false;

  document.addEventListener("DOMContentLoaded", async () => {
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) {
        return liff.login();
      }
    } catch(e) {
      console.warn("非 LINE 環境，改為測試模式");
    }

    // 建立 3 個 reel
    reels = [
      setupReel("reel1"),
      setupReel("reel2"),
      setupReel("reel3")
    ];

    preloadImages(SYMBOL_PATHS, () => {
      // 初始顯示一組圖
      reels.forEach(reel => {
        reel.index = randIndex();
        drawReel(reel);
      });
      const btn = document.getElementById("spinBtn");
      btn.disabled = false;
      btn.textContent = "開始拉霸";
      btn.onclick = startSpin;
    });
  });

  function preloadImages(list, cb) {
    let loaded = 0;
    images = list.map(src => {
      const img = new Image();
      img.src = src;
      img.onload = () => {
        loaded++;
        if (loaded === list.length) cb();
      };
      return img;
    });
  }

  function setupReel(id) {
    const canvas = document.getElementById(id);
    const ctx = canvas.getContext("2d");

    const scale = window.devicePixelRatio || 1;
    const w = canvas.width;
    const h = canvas.height;
    canvas.width = w * scale;
    canvas.height = h * scale;
    ctx.scale(scale, scale);

    return {
      canvas,
      ctx,
      width: w,
      height: h,
      index: 0,
      spinning: false,
      lastChange: 0
    };
  }

  function drawReel(reel) {
    const { ctx, width, height, index } = reel;
    ctx.clearRect(0,0,width,height);

    const img = images[index];
    if (!img) return;

    const padding = 12;
    const size = Math.min(width - padding*2, height - padding*2);
    const x = (width - size) / 2;
    const y = (height - size) / 2;

    ctx.drawImage(img, x, y, size, size);
  }

  function startSpin() {
    if (spinning) return;
    spinning = true;
    document.getElementById("msg").textContent = "";

    const btn = document.getElementById("spinBtn");
    btn.disabled = true;
    btn.textContent = "轉動中…";

    const startTime = performance.now();

    // 設定每軸為 spinning 狀態
    reels.forEach((reel, i) => {
      reel.spinning = true;
      reel.lastChange = startTime;
      setTimeout(() => {
        reel.spinning = false;
      }, SPIN_TIME[i]);
    });

    requestAnimationFrame(function loop(now) {
      let anySpinning = false;
      reels.forEach(reel => {
        if (reel.spinning) {
          anySpinning = true;
          if (now - reel.lastChange > CHANGE_INTERVAL) {
            reel.index = randIndex();
            reel.lastChange = now;
          }
        }
        drawReel(reel);
      });

      if (anySpinning) {
        requestAnimationFrame(loop);
      } else {
        finishSpin();
      }
    });
  }

  function finishSpin() {
    // 最終結果：直接設定每軸停在哪個水果
    const finalIndexes = [randIndex(), randIndex(), randIndex()];
    finalIndexes.forEach((idx, i) => {
      reels[i].index = idx;
      drawReel(reels[i]);
    });

    const resultKeys = finalIndexes.map(i => SYMBOL_KEYS[i]);
    const score = calcScore(resultKeys);

    const text = resultKeys.join(" | ");
    document.getElementById("msg").textContent =
      score > 0
        ? `🎉 恭喜！${text} ➜ 得分：${score}`
        : `😅 ${text}（未中獎）`;

    const btn = document.getElementById("spinBtn");
    btn.disabled = false;
    btn.textContent = "再抽一次";
    spinning = false;
  }

  function randIndex() {
    return Math.floor(Math.random() * SYMBOL_PATHS.length);
  }

  function calcScore(r) {
    if (r[0] === r[1] && r[1] === r[2]) {
      if (r[0] === "star")   return 500;
      if (r[0] === "cherry") return 200;
      if (r[0] === "lemon")  return 100;
      if (r[0] === "grape")  return 150;
    }
    return 0;
  }
</script>
</body>
</html>
