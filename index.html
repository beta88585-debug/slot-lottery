<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>社群限定拉霸</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
  /* 🔥 修正 LIFF WebView 的 100vh & 偏移問題 */
body {
  position: relative;
  height: 100%;
  min-height: 100dvh; /* 適配 iPhone Safari/LINE */
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden; /* 避免內容被背景推出去 */
  padding: 0 !important;
}

/* 🔥 slot 機台真正置中（不受背景干擾） */
.center-wrapper {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%); /* 真正置中 */
  width: 100%;
  max-width: 380px; /* 固定機台大小（避免縮超小） */
  padding: 0 16px;
}

/* 🔥 iPhone 安全區域（瀏海、底部條）避免擠壓內容 */
@supports(padding: env(safe-area-inset-top)) {
  body {
    padding-top: calc(env(safe-area-inset-top) + 0px);
    padding-bottom: calc(env(safe-area-inset-bottom) + 0px);
  }
}

/* ---- RESET ---- */
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
}
body {
  display: flex;
  justify-content: center;
  align-items: center;
  background:
    radial-gradient(circle at top, #ffefba 0%, #ffb347 12%, transparent 45%),
    radial-gradient(circle at bottom, #3b0000 0%, #000000 55%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  overflow: hidden;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}

/* ---- CENTER WRAPPER ---- */
.center-wrapper {
  width: 100%;
  max-width: 390px;
  padding: 0 14px;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* ---- OUTER GOLD GLOW ---- */
.frame-shadow {
  padding: 12px;
  border-radius: 26px;
  background: radial-gradient(circle at top, #ffcf6b, #7f3b00);
  box-shadow:
    0 18px 30px rgba(0,0,0,0.6),
    0 0 35px rgba(255,215,0,0.35);
}

/* ---- MACHINE ---- */
.machine {
  width: 100%;
  background: linear-gradient(160deg, #3a0006, #180009);
  border-radius: 22px;
  padding: 16px 12px 20px;
  box-shadow:
    0 0 0 3px rgba(255,255,255,0.15),
    inset 0 0 18px rgba(0,0,0,0.9);
  position: relative;
  overflow: hidden;
}
.machine::before {
  content:"";
  position: absolute;
  inset: 0;
  border-radius: 22px;
  background: linear-gradient(
    135deg,
    rgba(255,255,255,0.25) 0%,
    transparent 30%,
    transparent 70%,
    rgba(255,255,255,0.15) 100%
  );
  mix-blend-mode: screen;
  pointer-events: none;
  opacity: 0.45;
}

/* ---- TEXT ---- */
.title {
  text-align: center;
  font-weight: 800;
  font-size: 18px;
  color: #ffeaa7;
  letter-spacing: 1.5px;
  text-shadow:
    0 0 6px rgba(0,0,0,0.8),
    0 0 12px rgba(255,215,0,0.9);
  margin-bottom: 5px;
}
.subtitle {
  text-align: center;
  font-size: 11px;
  color: #ffdddd;
  opacity: 0.85;
  margin-bottom: 12px;
}

/* ---- REEL BOX ---- */
.reel-frame {
  background: radial-gradient(circle at top, #fff7d6, #ffd86a 30%, #4c0000 90%);
  padding: 8px;
  border-radius: 18px;
  box-shadow:
    inset 0 0 10px rgba(0,0,0,0.7),
    0 0 14px rgba(255,222,173,0.7);
}
.reel-inner {
  background: linear-gradient(180deg, #181828, #050510);
  border-radius: 14px;
  padding: 8px 8px;
  box-shadow:
    inset 0 0 16px rgba(0,0,0,0.9),
    0 0 18px rgba(0,255,255,0.35);
}

/* ---- REELS ---- */
.reels {
  display: flex;
  justify-content: center;
  gap: 10px;
}
canvas {
  background: radial-gradient(circle at top, #22243a, #050510);
  border-radius: 14px;
  box-shadow:
    0 0 0 2px rgba(0,0,0,0.7),
    0 0 18px rgba(0,255,255,0.5);
}

/* ---- NEON BAR ---- */
.neon-bar {
  height: 4px;
  border-radius: 999px;
  margin: 10px 28px 10px;
  background: linear-gradient(
    90deg,
    rgba(0,255,255,0) 0%,
    rgba(0,255,255,0.7) 35%,
    rgba(255,0,255,0.7) 65%,
    rgba(255,255,0,0) 100%
  );
  box-shadow:
    0 0 10px rgba(0,255,255,0.8),
    0 0 18px rgba(255,0,255,0.8);
}

/* ---- BUTTON ---- */
#spinBtn {
  width: 140px;
  padding: 12px;
  border: none;
  border-radius: 999px;
  background: radial-gradient(circle at top, #fff5cc, #ffd33b 40%, #ff9f1a 80%);
  font-size: 16px;
  font-weight: 800;
  color: #3a0000;
  margin-top: 6px;
  cursor: pointer;
  text-transform: uppercase;
  box-shadow:
    0 10px 0 #b05d00,
    0 16px 20px rgba(0,0,0,0.7);
  transition: transform .08s ease, box-shadow .1s ease;
}
#spinBtn:active:not(:disabled) {
  transform: translateY(3px);
  box-shadow:
    0 4px 0 #b05d00,
    0 8px 10px rgba(0,0,0,0.7);
}
#spinBtn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

/* ---- MESSAGE ---- */
#msg {
  margin-top: 10px;
  font-size: 13px;
  font-weight: 600;
  color: #ffeaa7;
  text-shadow: 0 0 6px rgba(0,0,0,0.7);
  min-height: 22px;
}
.footer {
  margin-top: 8px;
  font-size: 10px;
  opacity: 0.6;
  color: #ffd6d6;
}
</style>
</head>

<body>
<div class="center-wrapper">
  <div class="frame-shadow">
    <div class="machine">
      <div class="title">LUCKY SLOT</div>
      <div class="subtitle">社群限定｜深紅豪華賭場拉霸</div>

      <div class="reel-frame">
        <div class="reel-inner">
          <div class="reels">
            <canvas id="reel1" width="90" height="110"></canvas>
            <canvas id="reel2" width="90" height="110"></canvas>
            <canvas id="reel3" width="90" height="110"></canvas>
          </div>
        </div>
      </div>

      <div class="neon-bar"></div>
      <button id="spinBtn" disabled>載入中…</button>
      <div id="msg"></div>
      <div class="footer">本頁為娛樂示意，不涉及金錢博弈。</div>
    </div>
  </div>
</div>

<script>
const LIFF_ID="2008566845-ylJbXNmB";

const SYMBOL_PATHS=[
  "assets/symbols/cherry.png",
  "assets/symbols/lemon.png",
  "assets/symbols/grape.png",
  "assets/symbols/star.png"
];
const SYMBOL_KEYS=["cherry","lemon","grape","star"];

const CHANGE_INTERVAL=70;
const SPIN_TIME=[1000,1350,1700];

let reels=[],images=[],spinning=false;

document.addEventListener("DOMContentLoaded",async()=>{
  try{
    await liff.init({liffId:LIFF_ID});
    if(!liff.isLoggedIn())return liff.login();
  }catch(e){console.warn("非LINE環境");}

  reels=[
    setupReel("reel1"),
    setupReel("reel2"),
    setupReel("reel3")
  ];

  preloadImages(SYMBOL_PATHS,()=>{
    reels.forEach(r=>{r.index=randIndex();drawReel(r);});
    const btn=document.getElementById("spinBtn");
    btn.disabled=false;
    btn.textContent="SPIN";
    btn.onclick=startSpin;
  });
});

function preloadImages(list,cb){
  let loaded=0;
  images=list.map(src=>{
    const img=new Image();
    img.src=src;
    img.onload=()=>{loaded++;if(loaded===list.length)cb();};
    return img;
  });
}
function setupReel(id){
  const cvs=document.getElementById(id);
  const ctx=cvs.getContext("2d");
  const scale=window.devicePixelRatio||1;
  const w=cvs.width,h=cvs.height;
  cvs.width=w*scale;cvs.height=h*scale;ctx.scale(scale,scale);
  return {canvas:cvs,ctx,width:w,height:h,index:0,spinning:false,lastChange:0};
}
function drawReel(r){
  const{ctx,width,height,index}=r;
  ctx.clearRect(0,0,width,height);
  const img=images[index];if(!img)return;
  const p=10,size=Math.min(width-p*2,height-p*2);
  const x=(width-size)/2,y=(height-size)/2;
  ctx.save();
  ctx.shadowColor="rgba(255,255,255,0.4)";
  ctx.shadowBlur=10;
  ctx.drawImage(img,x,y,size,size);
  ctx.restore();
}
function startSpin(){
  if(spinning)return;
  spinning=true;
  document.getElementById("msg").textContent="";
  const btn=document.getElementById("spinBtn");
  btn.disabled=true;btn.textContent="SPINNING…";

  const start=performance.now();
  reels.forEach((r,i)=>{
    r.spinning=true;
    r.lastChange=start;
    setTimeout(()=>{r.spinning=false;},SPIN_TIME[i]);
  });

  requestAnimationFrame(function loop(now){
    let active=false;
    reels.forEach(r=>{
      if(r.spinning){
        active=true;
        if(now-r.lastChange>CHANGE_INTERVAL){
          r.index=randIndex();
          r.lastChange=now;
        }
      }
      drawReel(r);
    });
    if(active)requestAnimationFrame(loop);
    else finishSpin();
  });
}

function finishSpin(){
  const final=[randIndex(),randIndex(),randIndex()];
  final.forEach((i,idx)=>{
    reels[idx].index=i;
    drawReel(reels[idx]);
  });

  const resultKeys=final.map(i=>SYMBOL_KEYS[i]);
  const score=calcScore(resultKeys);
  document.getElementById("msg").textContent=
    score>0?`🎉 恭喜！${resultKeys.join(" | ")} ➜ 得分：${score}`
           :`😅 ${resultKeys.join(" | ")}（未中獎）`;

  const btn=document.getElementById("spinBtn");
  btn.disabled=false;btn.textContent="SPIN";
  spinning=false;
}
function randIndex(){return Math.floor(Math.random()*SYMBOL_PATHS.length);}
function calcScore(r){
  if(r[0]===r[1]&&r[1]===r[2]){
    if(r[0]==="star")return 500;
    if(r[0]==="cherry")return 200;
    if(r[0]==="lemon")return120;
    if(r[0]==="grape")return150;
  }
  return0;
}
</script>
</body>
</html>
