<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>LINE 抽獎拉霸 🍒</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top, #ffecd2, #fcb69f);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
      color: #333;
    }
    .wrapper {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }
    h1 {
      margin-top: 12px;
      margin-bottom: 4px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
    }
    .subtitle {
      font-size: 14px;
      opacity: 0.8;
      margin-bottom: 16px;
    }
    .machine {
      background: #ffffffdd;
      border-radius: 22px;
      box-shadow: 0 12px 25px rgba(0,0,0,0.15);
      padding: 18px 10px 20px;
      backdrop-filter: blur(3px);
    }
    .reels {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    canvas {
      border-radius: 12px;
      background: #1e1e2f;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.6);
    }
    #spinBtn {
      margin-top: 14px;
      padding: 12px 30px;
      border-radius: 999px;
      border: none;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, #ff6b6b, #fcb045);
      color: #fff;
      box-shadow: 0 8px 16px rgba(0,0,0,0.25);
      transition: transform 0.08s ease, box-shadow 0.08s ease, opacity 0.2s;
    }
    #spinBtn:active {
      transform: translateY(2px);
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
    #spinBtn[disabled] {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    #msg {
      margin-top: 12px;
      min-height: 24px;
      font-size: 14px;
      font-weight: 600;
    }
    #effect {
      position: relative;
      width: 100%;
      height: 0;
      overflow: visible;
    }
    .burst {
      position: absolute;
      left: 50%;
      top: -12px;
      transform: translateX(-50%);
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.9), rgba(255,231,150,0));
      animation: burst 0.6s ease-out forwards;
      pointer-events: none;
    }
    .effect-flash {
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.8);
      animation: flash 0.18s ease-out forwards;
      pointer-events: none;
    }
    @keyframes burst {
      from { opacity: 1; transform: translateX(-50%) scale(0.3); }
      to   { opacity: 0; transform: translateX(-50%) scale(1.2); }
    }
    @keyframes flash {
      from { opacity: 0.9; }
      to   { opacity: 0; }
    }
  </style>
</head>
<body>
<div class="wrapper">
  <h1>LINE 抽獎拉霸 🍒</h1>
  <div class="subtitle">社群限定水果拉霸，看看你的運氣 🍀</div>

  <div class="machine">
    <div class="reels">
      <canvas id="reel1" width="110" height="180"></canvas>
      <canvas id="reel2" width="110" height="180"></canvas>
      <canvas id="reel3" width="110" height="180"></canvas>
    </div>
    <button id="spinBtn" disabled>載入中...</button>
    <div id="msg"></div>
    <div id="effect"></div>
  </div>
</div>

<script>
  const LIFF_ID = "2008566845-ylJbXNmB";

  // ✨ 固定水果 + 色塊，避免 emoji 在不同手機消失
  const SYMBOLS = [
    { emoji:"🍒", key:"cherry", color:"#ff4d6d" },
    { emoji:"🍋", key:"lemon",  color:"#ffd93d" },
    { emoji:"🍇", key:"grape",  color:"#9b5de5" },
    { emoji:"⭐", key:"star",   color:"#ffa801" }
  ];

  const SYMBOL_HEIGHT = 90;
  const SPIN_TIME = [2000, 2600, 3200];
  let reels = [];
  let spinning = false;

  document.addEventListener("DOMContentLoaded", async () => {
    const btn = document.getElementById("spinBtn");

    // 初始化 LIFF
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) return liff.login();
    } catch (e) {
      console.warn("非 LINE 環境（測試模式）");
    }

    reels = [
      setupReel("reel1"),
      setupReel("reel2"),
      setupReel("reel3")
    ];

    drawAllReelsInitial();
    btn.disabled = false;
    btn.textContent = "開始拉霸";
    btn.onclick = startSpin;
  });

  function setupReel(id) {
    const canvas = document.getElementById(id);
    const ctx = canvas.getContext("2d");

    // ⭐重要：解決 iPhone/Android DPI 不同造成位移錯誤
    const scale = window.devicePixelRatio;
    canvas.width = canvas.width * scale;
    canvas.height = canvas.height * scale;
    ctx.scale(scale, scale);

    return { canvas, ctx, position: 0, speed: 0 };
  }

  function drawAllReelsInitial() {
    reels.forEach(drawReel);
  }

  function startSpin() {
    if (spinning) return;
    spinning = true;

    const btn = document.getElementById("spinBtn");
    btn.disabled = true;
    btn.textContent = "轉動中…";
    document.getElementById("msg").textContent = "";

    reels.forEach((reel, i) => {
      reel.speed = 30 + Math.random() * 10;
      setTimeout(() => stopReel(i), SPIN_TIME[i]);
    });

    animate();
  }

  function stopReel(i) {
    reels[i].speed = 0;
  }

  function animate() {
    let active = false;

    reels.forEach(reel => {
      if (reel.speed > 0.1) active = true;

      reel.position += reel.speed;
      if (reel.position > SYMBOL_HEIGHT * SYMBOLS.length)
        reel.position = 0;

      drawReel(reel);
    });

    if (active) requestAnimationFrame(animate);
    else onSpinFinished();
  }

  function drawReel(reel) {
    const { ctx, canvas, position } = reel;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let y = -position;
    for (let i = 0; i < SYMBOLS.length + 1; i++) {
      const s = SYMBOLS[i % SYMBOLS.length];

      // 背景色塊
      ctx.fillStyle = s.color;
      ctx.fillRect(10, y + 8, canvas.width / window.devicePixelRatio - 20, SYMBOL_HEIGHT - 16);

      // emoji 水果
      ctx.font = "40px Apple Color Emoji, Noto Color Emoji, system-ui";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(s.emoji, canvas.width / window.devicePixelRatio / 2, y + SYMBOL_HEIGHT / 2);

      y += SYMBOL_HEIGHT;
    }
  }

  function onSpinFinished() {
    const result = [rand(), rand(), rand()];
    const msg = document.getElementById("msg");

    showWinEffect();

    const score = calcScore(result);
    const text = result.map(r => r.key).join(" | ");

    msg.textContent = score > 0
      ? `🎉 恭喜！${text} ➜ 得分：${score}`
      : `😅 ${text}（未中獎）`;

    const btn = document.getElementById("spinBtn");
    btn.disabled = false;
    btn.textContent = "再抽一次";

    spinning = false;
  }

  function rand() {
    return SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
  }

  function calcScore(r) {
    if (r[0].key === r[1].key && r[1].key === r[2].key) {
      if (r[0].key === "star") return 500;
      if (r[0].key === "cherry") return 200;
      if (r[0].key === "lemon") return 100;
      return 150;
    }
    return 0;
  }

  function showWinEffect() {
    const effect = document.getElementById("effect");
    effect.innerHTML = "";
    const flash = document.createElement("div");
    const burst = document.createElement("div");

    flash.className = "effect-flash";
    burst.className = "burst";

    effect.appendChild(burst);
    document.body.appendChild(flash);

    setTimeout(() => {
      flash.remove();
      burst.remove();
    }, 600);
  }
</script>
</body>
</html>
