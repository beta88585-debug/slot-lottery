<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>社群限定拉霸 🎰</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at top, #ffefba 0%, #ffb347 12%, transparent 45%),
        radial-gradient(circle at bottom, #3b0000 0%, #000000 55%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
      text-align: center;
    }

    .frame-shadow {
      padding: 12px;
      border-radius: 32px;
      background: radial-gradient(circle at top, #ffcf6b, #7f3b00);
      box-shadow:
        0 18px 30px rgba(0,0,0,0.6),
        0 0 35px rgba(255,215,0,0.4);
    }

    .machine {
      width: 320px;
      background:
        linear-gradient(145deg, #3a0006, #20000c);
      border-radius: 26px;
      padding: 16px 14px 18px;
      position: relative;
      overflow: hidden;
      box-shadow:
        0 0 0 3px rgba(255,255,255,0.15),
        inset 0 0 18px rgba(0,0,0,0.8);
    }

    .machine::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 26px;
      background:
        linear-gradient(135deg,
          rgba(255,255,255,0.25) 0%,
          transparent 20%,
          transparent 80%,
          rgba(255,255,255,0.1) 100%);
      mix-blend-mode: screen;
      pointer-events: none;
      opacity: 0.4;
    }

    .title {
      position: relative;
      z-index: 1;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ffeaa7;
      text-shadow:
        0 0 6px rgba(0,0,0,0.9),
        0 0 14px rgba(255,215,0,0.9);
      margin-bottom: 4px;
    }

    .subtitle {
      position: relative;
      z-index: 1;
      font-size: 12px;
      color: #ffd6d6;
      opacity: 0.9;
      margin-bottom: 12px;
    }

    .reel-frame {
      position: relative;
      z-index: 1;
      padding: 8px 6px;
      border-radius: 18px;
      background:
        radial-gradient(circle at top, #fffae6, #ffd86a 25%, #4c0000 80%);
      box-shadow:
        inset 0 0 10px rgba(0,0,0,0.8),
        0 0 18px rgba(255,222,173,0.7);
    }

    .reel-inner {
      padding: 6px 8px;
      border-radius: 14px;
      background:
        linear-gradient(180deg, #171726, #050510);
      box-shadow:
        inset 0 0 16px rgba(0,0,0,0.9),
        0 0 12px rgba(0,255,255,0.3);
    }

    .reels {
      display: flex;
      justify-content: center;
      gap: 10px;
      align-items: center;
    }

    canvas {
      background: radial-gradient(circle at top, #22243a, #050510);
      border-radius: 14px;
      box-shadow:
        0 0 0 2px rgba(0,0,0,0.8),
        0 0 14px rgba(0,255,255,0.5);
    }

    .neon-bar {
      height: 4px;
      border-radius: 999px;
      margin: 8px 20px 4px;
      background:
        linear-gradient(90deg,
          rgba(0,255,255,0) 0%,
          rgba(0,255,255,0.7) 40%,
          rgba(255,0,255,0.7) 60%,
          rgba(255,255,0,0) 100%);
      box-shadow:
        0 0 10px rgba(0,255,255,0.8),
        0 0 18px rgba(255,0,255,0.8);
    }

    #spinBtn {
      position: relative;
      z-index: 1;
      margin-top: 8px;
      padding: 10px 32px;
      border-radius: 999px;
      border: none;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      color: #3a0000;
      text-transform: uppercase;
      background:
        radial-gradient(circle at top, #fff5cc, #ffd33b 35%, #ff9f1a 80%);
      box-shadow:
        0 10px 0 #b05d00,
        0 16px 22px rgba(0,0,0,0.6);
      transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.1s ease;
    }

    #spinBtn:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow:
        0 4px 0 #b05d00,
        0 8px 12px rgba(0,0,0,0.7);
      filter: brightness(0.95);
    }

    #spinBtn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      box-shadow:
        0 4px 0 #6b3b00,
        0 6px 8px rgba(0,0,0,0.6);
    }

    #msg {
      margin-top: 10px;
      min-height: 24px;
      font-size: 13px;
      font-weight: 600;
      color: #ffeaa7;
      text-shadow: 0 0 6px rgba(0,0,0,0.8);
      position: relative;
      z-index: 1;
    }

    .footer {
      margin-top: 8px;
      font-size: 10px;
      opacity: 0.6;
      color: #ffd6d6;
      text-shadow: 0 0 6px rgba(0,0,0,0.7);
    }
  </style>
</head>
<body>
<div class="frame-shadow">
  <div class="machine">
    <div class="title">LUCKY SLOT</div>
    <div class="subtitle">社群限定｜深紅賭場風霓虹拉霸</div>

    <div class="reel-frame">
      <div class="reel-inner">
        <div class="reels">
          <canvas id="reel1" width="90" height="110"></canvas>
          <canvas id="reel2" width="90" height="110"></canvas>
          <canvas id="reel3" width="90" height="110"></canvas>
        </div>
      </div>
    </div>

    <div class="neon-bar"></div>

    <button id="spinBtn" disabled>載入中…</button>
    <div id="msg"></div>

    <div class="footer">本頁為娛樂活動介面示意，不涉及金錢博弈。</div>
  </div>
</div>

<script>
  const LIFF_ID = "2008566845-ylJbXNmB";

  // PNG 路徑 & 對應名稱（你之後把這些換成「金屬風水果」圖就會更有感）
  const SYMBOL_PATHS = [
    "assets/symbols/cherry.png",
    "assets/symbols/lemon.png",
    "assets/symbols/grape.png",
    "assets/symbols/star.png"
  ];
  const SYMBOL_KEYS = ["cherry", "lemon", "grape", "star"];

  const CHANGE_INTERVAL = 70;         // 洗牌速度
  const SPIN_TIME = [1000, 1350, 1700]; // 三軸依序停止時間（ms）

  let reels = [];
  let images = [];
  let spinning = false;

  document.addEventListener("DOMContentLoaded", async () => {
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) {
        return liff.login();
      }
    } catch (e) {
      console.warn("非 LINE 環境，改為測試模式：", e);
    }

    // 建立三個 reel
    reels = [
      setupReel("reel1"),
      setupReel("reel2"),
      setupReel("reel3")
    ];

    preloadImages(SYMBOL_PATHS, () => {
      // 初次顯示
      reels.forEach(reel => {
        reel.index = randIndex();
        drawReel(reel);
      });

      const btn = document.getElementById("spinBtn");
      btn.disabled = false;
      btn.textContent = "SPIN";
      btn.onclick = startSpin;
    });
  });

  function preloadImages(list, cb) {
    let loaded = 0;
    images = list.map(src => {
      const img = new Image();
      img.src = src;
      img.onload = () => {
        loaded++;
        if (loaded === list.length) cb();
      };
      return img;
    });
  }

  function setupReel(id) {
    const canvas = document.getElementById(id);
    const ctx = canvas.getContext("2d");

    const scale = window.devicePixelRatio || 1;
    const w = canvas.width;
    const h = canvas.height;

    canvas.width = w * scale;
    canvas.height = h * scale;
    ctx.scale(scale, scale);

    return {
      canvas,
      ctx,
      width: w,
      height: h,
      index: 0,
      spinning: false,
      lastChange: 0
    };
  }

  function drawReel(reel) {
    const { ctx, width, height, index } = reel;
    ctx.clearRect(0, 0, width, height);

    const img = images[index];
    if (!img) return;

    const padding = 10;
    const size = Math.min(width - padding * 2, height - padding * 2);
    const x = (width - size) / 2;
    const y = (height - size) / 2;

    // 如果之後你用的是金屬風 PNG，可以在這裡再加個底光效果
    ctx.save();
    ctx.shadowColor = "rgba(255,255,255,0.45)";
    ctx.shadowBlur = 10;
    ctx.drawImage(img, x, y, size, size);
    ctx.restore();
  }

  function startSpin() {
    if (spinning) return;
    spinning = true;

    document.getElementById("msg").textContent = "";

    const btn = document.getElementById("spinBtn");
    btn.disabled = true;
    btn.textContent = "SPINNING…";

    const startTime = performance.now();

    reels.forEach((reel, i) => {
      reel.spinning = true;
      reel.lastChange = startTime;
      setTimeout(() => {
        reel.spinning = false;
      }, SPIN_TIME[i]);
    });

    requestAnimationFrame(function loop(now) {
      let anySpinning = false;
      reels.forEach(reel => {
        if (reel.spinning) {
          anySpinning = true;
          if (now - reel.lastChange > CHANGE_INTERVAL) {
            reel.index = randIndex();
            reel.lastChange = now;
          }
        }
        drawReel(reel);
      });

      if (anySpinning) {
        requestAnimationFrame(loop);
      } else {
        finishSpin();
      }
    });
  }

  function finishSpin() {
    const finalIndexes = [randIndex(), randIndex(), randIndex()];

    finalIndexes.forEach((idx, i) => {
      reels[i].index = idx;
      drawReel(reels[i]);
    });

    const resultKeys = finalIndexes.map(i => SYMBOL_KEYS[i]);
    const score = calcScore(resultKeys);
    const text = resultKeys.join(" | ");

    const msg = document.getElementById("msg");
    if (score > 0) {
      msg.textContent = `🎉 恭喜！${text} ➜ 得分：${score}`;
    } else {
      msg.textContent = `😅 ${text}（未中獎，再試一次！）`;
    }

    const btn = document.getElementById("spinBtn");
    btn.disabled = false;
    btn.textContent = "SPIN";

    spinning = false;
  }

  function randIndex() {
    return Math.floor(Math.random() * SYMBOL_PATHS.length);
  }

  function calcScore(r) {
    if (r[0] === r[1] && r[1] === r[2]) {
      if (r[0] === "star")   return 500;
      if (r[0] === "cherry") return 200;
      if (r[0] === "lemon")  return 120;
      if (r[0] === "grape")  return 150;
    }
    return 0;
  }
</script>
</body>
</html>
